[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-health-explainer"
version = "0.3.0"
description = "FHIR validation explanation and negative-test generation prototype"
requires-python = ">=3.10"

[project.scripts]
ohe = "ohe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
ohe = ["workflow.html", "specs/*/*.json", "specs/*/definitions/*.json"]
